spring.application.name=oficioya-users

# Credenciales
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficioya-usersdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Mensajes y errores de validación
server.error.include-message=always
server.error.include-binding-errors=always

logging.file.name=logs/oficioya-users.log

# JWT emitido por Identity
jwt.secret=${JWT_SECRET}

admin.email=${ADMIN_EMAIL:}
admin.name=${ADMIN_NAME:Administrador}
admin.phone=${ADMIN_PHONE:}