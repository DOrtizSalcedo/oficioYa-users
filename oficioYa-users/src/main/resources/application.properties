spring.application.name=oficioya-users

# Base de datos: las credenciales vienen de variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficioya-usersdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Ejecuta data.sql (roles iniciales) después de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Muestra el mensaje y los errores de validación en las respuestas de error
server.error.include-message=always
server.error.include-binding-errors=always

logging.file.name=logs/oficioya-users.log

# JWT emitido por Identity (HS256, misma clave que Identity, mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:clave-de-desarrollo-local-cambiar-minimo-32-caracteres}
jwt.roles-claim=${JWT_ROLES_CLAIM:roles}