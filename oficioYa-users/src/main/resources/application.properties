spring.application.name=oficioya-users

spring.datasource.url=jdbc:postgresql://localhost:5432/oficioya-usersdb
spring.datasource.username=OficioYaUsers
spring.datasource.password=Us3rs262*
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.file.name=logs/oficioya-users.log
logging.level.root=INFO
logging.level.edu.eci.dosw.oficioya_users=INFO

# JWT emitido por Identity (HS256). La clave debe ser la misma que usa Identity (mínimo 32 caracteres).
jwt.secret=${JWT_SECRET:clave-de-desarrollo-local-cambiar-minimo-32-caracteres}

# Nombre del claim donde Identity envía los roles ("roles" como lista o "role" como texto)
jwt.roles-claim=${JWT_ROLES_CLAIM:roles}