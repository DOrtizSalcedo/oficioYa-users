spring.application.name=oficioya-users

# Base de datos en memoria para pruebas
spring.datasource.url=jdbc:h2:mem:oficioya_users;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=clave-de-pruebas-unitarias-con-minimo-32-caracteres
jwt.roles-claim=roles

logging.level.root=WARN
