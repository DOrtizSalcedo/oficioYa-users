spring.datasource.url=jdbc:h2:mem:oficioya_users;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Ejecuta data.sql (roles iniciales) después de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=clave-de-pruebas-unitarias-con-minimo-32-caracteres
jwt.roles-claim=roles

logging.level.root=WARN